# paper/manifest.yaml — Single Source of Truth for the KrishokTech Paper Ecosystem.
# Last audited: 2026-09-03 (Stage 2 KAERA / PRISM Architecture Synced)

meta:
  project: KrishokTech Agricultural Advisory System
  framework: KAERA / PRISM (Answerability-Aware Progressive Advisory)
  active_venues:
    cea_journal:
      venue: Computers and Electronics in Agriculture (CEA), Elsevier
      type: Full Original Research Paper (approx. 10,000 words)
      workspace: CEA Paper/
      status: in_active_preparation
    eacl_demo:
      venue: EACL 2027 System Demonstrations, ACL
      type: System Demonstration Paper (<= 6 pages main + unlimited refs/appendix)
      workspace: EACL Demo/
      status: in_active_preparation
  paper_policy: docs/PAPER_POLICY.md
  deprecated_arxiv_ban: "arXiv:2606.29243 must never be cited, linked, or summarized"

packages:
  cea_paper:
    manifest: CEA Paper/manifest.yaml
    readme: CEA Paper/README.md
    manuscript_dir: CEA Paper/manuscript/
    drafts_dir: CEA Paper/drafts/
    experiments_dir: CEA Paper/experiments/
    master_results: CEA Paper/experiments/results.yaml
  eacl_demo:
    manifest: EACL Demo/manifest.yaml
    readme: EACL Demo/README.md
    manuscript_dir: EACL Demo/manuscript/
    drafts_dir: EACL Demo/drafts/
    experiments_dir: EACL Demo/experiments/
    master_results: EACL Demo/experiments/results.yaml
  legacy_expert_systems:
    path: manuscript/
    status: frozen_archive
    compile_target: manuscript/krishokchat_wiley_expert_systems.tex
    compiled_pdf: manuscript/krishokchat_wiley_expert_systems.pdf
    claim_ledger: manuscript/CLAIM_LEDGER_FREEZE.md

literature_review:
  path: literature review/
  scope: literature review/00_SCOPE_AND_ANGLES.md
  synthesis: literature review/10_SYNTHESIS_GAPS_POSITIONING.md
  gaps_matrix: literature review/11_RESEARCH_GAPS_competitive_matrix.md
  asset_verification: literature review/12_ASSET_VERIFICATION.md

published_prior_art:
  path: done papers/
  papers:
    - done papers/KrishokChat__A_Provenance_Traceable_Multi_Task_Bengali_Agricultural_Benchmark_with_Safety_Critical_Chemical_Advisory.pdf
    - done papers/AgriTrust.pdf

notes:
  path: notes/
  entries:
    - notes/2026_08_27_R13_E26_findings.md
    - notes/2026_08_27_CEA_EXPERIMENT_BATTERY_SUMMARY.md

experiment_trace:
  canonical_registry: experiments/registry.yaml
  acceptance_protocol: experiments/ACCEPTANCE_PROTOCOL.md
  aggregation_plan: experiments/IMPLEMENTATION_AND_AGGREGATION_PLAN.md
