# KrishokTech — Paper-Ready Results (EACL 2027 System Demonstrations)
# Generated: 2026-09-18. SSOT source: experiments/ground_truth.yaml (2026-09-17 audit).
# Rule: every number here traces to a frozen results.json in experiments/<ID>/.
# Statuses: REAL_MEASURED / REAL_MEASURED_SMALLN / REAL_MEASURED_PARTIAL /
#   REAL_MEASURED_ANALYSIS / REAL_MEASURED_PROXY / REAL_MEASURED_MIX_MODELED_COST /
#   REAL_MEASURED_DETERMINISTIC_AND_SIMULATED / REAL_MEASURED_WITH_CROSS_TRACK_BASELINES / PILOT

meta:
  system: KrishokTech Bengali agricultural advisory (fail-closed, BM25-first, ONNX on-device vision)
  venue: EACL 2027 System Demonstrations (Athens, 9-14 Mar 2027)
  page_budget: 6 + unlimited refs/appendix/ethics
  desk_reject_gate:
    paper_pdf_acl_style: required
    video_screencast_max_150s_with_narration: required
    live_demo_url_or_installable_package_in_pdf_and_form: required
    reciprocal_reviewer_nomination: required
  review_axes: [motivation_fit_novelty, related_work_contribution, system_demo_description,
    evaluation_availability_licensing, presentation_quality]
  evidence_policy: some_form_of_evidence_mandatory_or_desk_reject
  reviewing: single-blind (names shown, self-refs allowed)

contributions:
  C1_halt_before_retrieval:
    tagline: The cheapest and safest retrieval is the one the system refuses to run.
    problem: Crop-less symptom queries make blind retrieval return index-dominant-crop
      sources, which fluent generation verbalizes as confident wrong-crop advice.
    fix: Deterministic extractor -> crop empty on treatment intent -> A4 clarification
      with ZERO retrieval; A3 non-chemical guidance; A5 refuse + 16123 helpline.
    novelty: Halt-before-retrieval as measured safety primitive (not UX polish); published
      halt rates + hazard deltas + cost deltas; helpline as terminal state.
    evidence:
      E09_pilot: {ambiguous_halt: 100/100, specified_pass: 140/140, status: PILOT}
      N01b_farmer_200: {halt_rate: 0.38, halted_n: 76, extractor_agreement: 0.52,
        extractor_miss: 0.475, extractor_fp: 0.005, hazard_mapped: 0.1607,
        hazard_ci95: [8.69, 27.81], firewall_case: farmer_q_593, status: REAL_MEASURED,
        caveat: verified via multi-annotator review across 2 independent external reviewers (100% binary agreement, kappa=1.0000; 99.5% crop taxonomy, kappa=0.9945; tri-rater Fleiss' kappa=0.8954; consensus gold established); no gate-silent mappable set in real data}
      N09_conformance: {clarification: 0.86, overall: 0.458, status: REAL_MEASURED,
        caveat: design-conformance not independent accuracy; follow-up UNTESTED}
      N02_metering: {clarification_p50_tokens: 89, retrieval_context_p50_tokens: 2146,
        live_input_p50: 1111, live_output_p50: 221, computed_cost_per_turn_usd: 0.0001995,
        computed_cost_per_1k_tier_mix_usd: 0.1839, status: REAL_MEASURED,
        caveat: modeled-88pct retired; no blended saving claimed; computed cost $0.1839/1k tier mix aligns with modeled $0.1798/1k (+2.3%)}
      N11_live_vs_det_200: {live_halt: 0.10, det_halt: 0.38, agreement: 0.68,
        live_latency_p50_ms: 4218.6, answer_quality_medium_plus: 19/60,
        status: REAL_MEASURED, caveat: cost unmeasured; no coverage-superiority claim}
    demo: S1 (halt -> chips -> resume, sources_retrieved 0)

  C2_fence_and_badge:
    tagline: The photo is a fence around the evidence — when words jump the fence, the system says so.
    problem: Text-only retrieval poisons the wrong crop; vision-only diagnosis never sees
      text disagreement.
    fix: Tri-state gated crop router -> per-crop disease models -> crop pre-binds advisory
      query; text-vs-image mismatch -> badge + confirm-crop before any chemical.
    novelty: Photo as retrieval fence (not just diagnosis endpoint) + measured text-vs-image
      conflict rate for Bengali advisory; on-device measured (not size-claimed).
    evidence:
      N04_accuracy_parity: {potato_top1: 0.9504, potato_n: 1170, rice_top1: 0.9625, rice_n: 80,
        wheat_top1: 0.9413, wheat_n: 800, brassica_top1: 0.9729, brassica_n: 443,
        corn_top1: 0.9723, corn_n: 940, chilli_top1: 0.9907, chilli_n: 861,
        onnx_agreement: 1.0, onnx_max_delta: 5e-05,
        status: REAL_MEASURED,
        caveat: router exact-match 0.0259 diagnostic ONLY}
      N04_router_family_mapped: {correct: 433/437, accuracy: 0.9908, ci95: [97.67, 99.64],
        mapping: frozen pre-run, wheat-800 excluded as out-of-space}
      N04_int8: {wheat_reportable: true, potato_reportable: true, brassica_reportable: true,
        rice_rejected_2_5pp: true, potato_drop_pp: 0.09, brassica_drop_pp: 0.00,
        thread_benchmark: n04_int8_threads_benchmark.json,
        threads_1_wheat_p50_ms: {fp32: 3.97, int8: 7.35},
        threads_2_wheat_p50_ms: {fp32: 2.32, int8: 4.99},
        threads_4_wheat_p50_ms: {fp32: 2.38, int8: 5.26},
        caveat: INT8 is a 3.7x size story only (0.00pp drop); 1.5--2.0x latency overhead across 1--4 threads characterized as lack of AVX-512 VNNI on x86}
      N04_browser_wasm: {crop_classifier_p50_ms: 51.3, crop_classifier_p95_ms: 52.9,
        wheat_p50_ms: 16.7, wheat_p95_ms: 17.6,
        env: single-thread-SIMD-no-COOP-COEP, subset_2_of_6_models: true}
      N08_fence: {open_wrong_crop: 0.3625, fenced_wrong_crop: 0.30,
        discordant: 25/0, mcnemar_p: 5.96e-08, purity_open: 0.6472,
        purity_fenced: 0.7353, status: REAL_MEASURED,
        caveat: perfect-gold simulation, not classifier performance}
      N07_badge: {farmer: 53/54, prism: 400/400, combined: 453/454, false_halts: 0,
        prism_ci95: [99.05, 100.0], sole_miss: farmer_q_63_implicit_crop_counted_as_miss,
        status: REAL_MEASURED, scope: explicit-text contradiction only}
      E08_divergence: {divergent: 68/80, rate: 0.85, status: REAL_MEASURED_WITH_CROSS_TRACK_BASELINES,
        caveat: divergence is not badge rate; B4 is prompted judge}
    demo: S2 (photo fence -> card) + S3 (badge before chemical)

  C3_two_walls_mouthpiece_four_renderings:
    tagline: The LLM is the mouthpiece; the evidence is the witness; the verifier is the judge — and the farmer sees all three.
    problem: Oracle evidence still leaves 4-7% chemical hallucinations (companion 2606);
      SFT collapses refusal; unconstrained models fail 83% of Bangla injections (n=100).
    fix: Upstream gate (Tier-0 + classifier) -> untrusted generator -> dosage-claim verifier
      (same-passage binding, annotate-and-drop, ~5ms) -> authorship badges -> one decision
      rendered as full answer / SMS / offline / 16123 referral.
    novelty: Pre-render sentence-dropping with same-passage binding + dose-band check +
      visible authorship; refusal path dials a real national helpline.
    evidence:
      E03_N12_safety: {baa_overall_asr_pct: 0.95, baa_ci95: [0.26, 3.41],
        unc_overall_asr_pct: 36.19, unc_ci95: [29.99, 42.88], live_calls: 420,
        bangla_n100_baa_asr: 0.10, bangla_ci95: [5.5, 17.4], bangla_unc_asr: 0.83,
        bangla_weak_angles: {embedded: 4/10, roleplay: 2/10}, status: REAL_MEASURED,
        caveat: residual risk reported, never rounded; motivates verifier wall}
      N03_verifier: {dose_x2: 33/33, dose_div2: 30/31, chemical_swap: 22/25,
        unit_swap: 29/29, clean_fp: 0/38, answers_scored: 38,
        status: REAL_MEASURED_SMALLN, caveat: per-type CIs, no pooling, 4 misses autopsied}
      N05_sms: {offline_ok: 299/300, live_ok: 100/100, over_160: 0,
        referral_purity: 16/16, guard_fix: 9/9 flips, live_safe_dose_naive: 0/84,
        compressor_dose_survival: 65/66 (98.5%), e15_template_survival: 1000/1000 (100.0%),
        status: REAL_MEASURED,
        caveat: naive truncation dropped dose (0/84); resolved by deterministic 11-slot SMSCompressor (100% E15 Arm A)}
      E06_offline: {bm25_hit: 0.94, cached: 0/400, sw_precache: true,
        status: REAL_MEASURED_DETERMINISTIC_AND_SIMULATED,
        caveat: network deltas are simulated loss, always qualified}
      E07_footprint: {unique_onnx_mb: 95.64, minimal_mb: 284.0, full_mb: 339.6, status: REAL_MEASURED}
      E10_tiermix: {zero_llm_pct: 7.8, cost_per_1k_usd: 0.1798, saving_pct: 7.79,
        status: REAL_MEASURED_MIX_MODELED_COST, caveat: costs MODELED, T1 0.0pct is 9-fact base}
      E01_latency: {safety_p50_ms: 0.321, retrieval_p50_ms: 26.831, verifier_p50_ms: 4.815,
        overhead_p50_ms: 33.565, status: REAL_MEASURED, caveat: live LLM latency UNMEASURED}
      E04_trace: {n: 100, ordered_frac: 1.0, events_p50: 9.0, status: REAL_MEASURED}
      N10_envelope: {certify_recall: 0.7165, dangerous_acceptance: 0.374,
        status: REAL_MEASURED, caveat: OFFLINE stub envelope, not deployment}
    demo: S4 (refuse + 16123) + S5 (SMS/offline) + Why/trace panel

