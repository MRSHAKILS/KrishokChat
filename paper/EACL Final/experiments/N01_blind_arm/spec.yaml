id: N01
title: Blind-RAG hazard arm (equivalence locked; delta pending labels)
question: What cross-crop hazard does the gate prevent vs blind retrieval on IDENTICAL real queries?
status: REAL_MEASURED_PARTIAL
beats: [B]
lane: A
locked_N01a:
  design: {n_paired: 400, categories: [B, C, D, I], top_k: 5, blind: pipeline-identical minus gate, gated: frozen offline pipeline (deterministic precheck-only safety, stub LLM, BM25-only)}
  key:
    blind_overall: 0.3025
    blind_ci95: [25.95, 34.92]
    gated_overall: 0.2875
    gated_ci95: [24.53, 33.37]
    gated_conditional_on_retrieved: 0.2875
    mcnemar_exact_p: 0.03125
    discordant: {blind_only: 6, gated_only: 0}
    halt_rate: 0.0
    unknown_frac: 0.1352
    blind_terminals: 0
    F_spread_mean_distinct_crops: 3.35
  meaning: All 400 rows mention a recognizable crop, so the gate passes everywhere. Gating eliminates 6 blind-arm wrong-crop cases with zero reversals; overall rates stay close (0.3025 vs 0.2875). This checks construction fidelity and the fence direction, not gate efficacy — the set cannot test the gate (halt_rate 0.0).
labels_source: team labels crop_slot_labeling_sheet_200.json (200 rows, single-reviewer, provenance in file)
locked_N01b_farmer:
  design: {n: 200, labels: agent-single-review-2026-09-17, arms: paired blind/gated, McNemar: true}
  key:
    halt_rate: 0.15
    halted_n: 30
    passed_n: 170
    refused_n: 0
    extractor_agreement: 0.955
    extractor_miss: 0.015
    extractor_fp: 0.03
    hazard_mapped_n: 56
    hazard_blind_eq_gated: 0.3036
    hazard_ci95: [19.9, 43.34]
    hazard_discordant: 0/0
  meaning: >
    On real queries the gate halts 15% (30/200 crop-less rows) with zero
    sources and passes 170 to fenced search. The 45-crop extractor resolves
    95.5% of crop slots (miss 1.5%, FP 3.0% — every FP case contains a
    genuine crop mention on a multi-crop, sourcing, or business query).
    Mapped-crop rows tie between arms at 0.3036 [19.9, 43.34] with zero
    discordant pairs (no observed difference; n=56 too small for
    equivalence). Hazard numbers are single-reviewer; second human pass
    pending on disagreements + unclear set.
outputs:
  - N01_blind_arm/results_equivalence.json (N01a locked copy)
  - N01_blind_arm/results_farmer.json (N01b locked copy)
  - N01_blind_arm/labeling_sheet_200.json (team labels with provenance)
  - experiments/results/n01_records_20260919.jsonl (400 per-query records)
  - experiments/results/n01b_records_20260919.jsonl (200 per-query records)
labels:
  retired: The 38.5% constant is dead.
  method_split: Paired arms use thresholded retrieve(top_k=5); F-spread uses unthresholded candidates(depth=10)[:5] — F stays descriptive.
