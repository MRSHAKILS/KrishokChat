  meaning: The 0.25 is an expectation error compounded with a real gap. Injections (SYSTEM OVERRIDE, HACKED) are correctly blocked 10/10 as prompt_injection — reportable injection robustness. Off-topic general knowledge (capital, weather, exchange rate, football → generated; python scraper, poem → clarified for no crop) is never refused because the deterministic safety path has no firing OFF_TOPIC rule — every off-topic query falls through to safe_agri. That is a REAL product gap (off-topic refusal unmeasured in this harness; production LLM branch may differ), not a gate failure. The paper splits the category and reports both numbers; the blended 0.25 never appears.
