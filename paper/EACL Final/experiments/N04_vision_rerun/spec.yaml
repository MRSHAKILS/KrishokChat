id: N04
title: Vision re-run on current 10-class checkpoints (E02 replacement)
question: What are per-model accuracy, ONNX parity, INT8 reportability, WASM timings on CURRENT hashes?
status: REAL_MEASURED
beats: [D+E]
lane: A
contract: plans/experiments/results/artifact_hashes.md
locked_accuracy_parity:
  design: {manifest_n: 4294, checkpoints: current-20260917, imgsz_per_model: true}
  key:
    potato_top1: 0.9504
    potato_n: 1170
    rice_top1: 0.9625
    rice_n: 80
    rice_scope: 8 legacy classes (Others/Turongo support 0 — untested)
    wheat_top1: 0.9413
    wheat_n: 800
    brassica_top1: 0.9729
    brassica_n: 443
    corn_top1: 0.9723
    corn_n: 940
    chilli_top1: 0.9907
    chilli_n: 861
    onnx_agreement: 1.0
    onnx_max_delta: 5e-05
    router_top1_exact_match: 0.0259
    router_rule: report ONLY as label-space-mismatch diagnostic + species breakdown; never as quality; drop router macroF1
    router_family_mapped: {n: 437, correct: 433, accuracy: 0.9908, ci95: [97.67, 99.64], mapping: frozen family_mapping_freeze.md pre-run, wheat-800 excluded as out-of-space}
    routing_hint_off: {diagnosed: 308, uncertain: 387, not_recognized: 162, no_disease_model: 183, ood: 15, invalid_image: 10, requires_second_image: 38, healthy: 134}
  browser_wasm_latency:
    crop_classifier: {p50_ms: 51.3, p95_ms: 52.9, n: 10, shape: [1,3,224,224]}
    wheat: {p50_ms: 16.7, p95_ms: 17.6, n: 10, shape: [1,3,224,224]}
    env: {num_threads: 1, simd: true, cross_origin_isolated: false}
    subset: "2/6 models (smallest); 3 warmup + 10 measured; inference-only random tensor; prep excluded"
  forensic: critic ACCEPT-WITH-FIXES 2026-09-17, all 8 fixes applied (true notes, chilli listed, hashes regenerated); re-run reproduced identical metrics (deterministic)
locked_int8:
  design: {method: ORT static quantization, disjoint calibration/held-out splits, gate: 2.0pp max drop + agreement}
  key:
    wheat: {accepted: true, reportable: true, drop_pp: 0.0, agree: 1.0}
    crop_classifier: {artifact_produced: true, agree: 0.9377, accuracy_claimable: false, reason: top-1 is the label-space diagnostic, not router accuracy}
    potato: {accepted: true, reportable: true, drop_pp: 0.09, agree: 0.9880, held_out_n: 1170}
    brassica: {accepted: true, reportable: true, drop_pp: 0.00, agree: 0.9910, held_out_n: 443}
    rice: {rejected: true, drop_pp: 2.5, agree: 0.975, reason: exceeds 2.0pp gate — artifact exists, unusable, never deployed}
    corn: {fp32_only: true, top1: 0.9723, n: 940}
    chilli: {fp32_only: true, top1: 0.9907, n: 861}
  meaning: Wheat, potato, and brassica carry quantitative INT8 accuracy claims (all pass <= 2.0pp drop on held-out n >= 100). INT8 is NOT faster here (higher latency than FP32 on measured models) — never claim speedup. Artifact-produced != accuracy-supported.
pending:
  wasm_rerun: conditional (needs playwright install + refreshed frontend models)
  family_mapped_router_rescore: only with frozen preregistered mapping (none exists — do not post-hoc)
labels:
  coverage_gap: Tomato/Eggplant/Gourd/Guava route to no model; Wheat/Corn models have no router class (hint-only). Product limitation, disclosed.
  gate_disclosure: tri-state crop gate + per-disease thresholds drive the distribution (VisionGateConfig values to be published in methods).
outputs:
  - N04_vision_rerun/results_baseline.json (locked copy)
  - N04_vision_rerun/results_parity.json (locked copy)
  - N04_vision_rerun/export_report.json (locked copy)
