id: N05
title: SMS survival through the real endpoint (offline enforcement + live field measurement)
question: Does the 160-char SMS enforce limits, keep referrals pure, and preserve dose content?
status: REAL_MEASURED
beats: [C+G]
lane: A-lite
locked_offline:
  design: {n: 300, seed: 42, container: stub (no live text needed for enforcement paths)}
  key: {ok: 299, fail_input_validation: 1, over_160: 0, blocked_or_lowconf: 35, blocked_referral_only: 35}
  meaning: Length enforcement holds on every response; every unsafe/uncertain answer becomes a referral text. The 1 failure is correct schema rejection of a >300-char input.
locked_live:
  design: {n: 100, container: production live (OpenRouter), seed: 42,
    live_config: {model: google/gemini-2.5-flash-lite, temperature: 0.2, max_output_tokens: 1000},
    latency: per-record latency_ms in jsonl}
  key:
    ok: 100
    over_160: 0
    taxonomy: {verified_advice: 74, flagged_referral: 7, clarification: 11, blocked_referral: 8}
    referrals_total: 15
    safe_n: 92
    safe_with_dose_pattern: 12
    blocked_with_dose_or_chemical: 0
    max_len: 160
    non_gsm7_texts: 100
    guard_flips_from_v1: 0
  meaning: 74 verified advice + 7 flagged referrals + 11 clarifications + 8 blocked referrals, all within 160 characters. Referral purity holds (0 dose/chemical in blocked texts). Truncated dose survival varies with preamble length across runs (12/92 here) — unreliable by nature, which is why the deterministic packer carries the dose-survival claim. All Bengali texts are non-GSM7 — length claims stay in characters, never segments.
  dose_chemical_definitions: frozen in run_n05_sms.py analyze_dose_chemical (digit+unit adjacency per verifier notion; Title/UPPER-case active lexicon); summary JSON carries the counts.
sms_guardrail_behavior:
  verifier_flags non-empty → referral SMS (backend/app/api/extras.py); 7/7 flagged runs in current measurement follow this path.
  v1_archived: n05_sms_offline_20260917_v1 + n05_sms_live_20260917_v1
outputs:
  - N05_sms_survival/results_offline.json (locked copy)
  - N05_sms_survival/results_live.json (locked copy)
labels:
  packer_carries_dose_claim: field survival is claimed only for the deterministic 11-slot compressor (E15 Arm A), never for truncation.

# ---- N05c: LLM-summarizer strong baseline (reviewer-driven, 2026-09-19) ----
n05c_llm_summarizer_baseline:
  status: REAL_MEASURED
  question: Does the deterministic 11-slot compressor stay necessary against
    an actual LLM summarizer (not just naive truncation)?
  design:
    n: 100
    seed: 42
    pool: 652 advisories from farmer_benchmark_1000.jsonl with
      len(gold_answer) > 160 AND a frozen dose pattern
    prompt: reviewer's wording verbatim + "Output only the SMS text, no preamble"
    live_config: {model: google/gemini-2.5-flash-lite, temperature: 0.2,
      max_output_tokens: 500, gateway: OpenRouter}
  key:
    dose_survival: {naive: 23/100, llm: 89/100, compressor: 92/100}
    chem_survival: {naive: 20/100, llm: 56/100, compressor: 34/100}
    len_ok: {naive: 100/100, llm: 98/100, compressor: 100/100}
    llm_hallucinations: 2 records with new dose pairs (1 genuine invention,
      farmer_q_608: "800-1000g urea" with no numeric urea basis in source;
      1 borderline paraphrase, farmer_q_304: "per litre" rendered "1 litre");
      0 chemical hallucinations after urea-spelling normalization.
  meaning: The LLM is a strong baseline (89% dose) but probabilistic — it
    violates the length ceiling (2/100) and invents dosage (genuine case
    observed). The compressor matches/beats it on dose (92/100) with a
    100% length guarantee and zero hallucination by construction. Chem-name
    retention favors the LLM (56 vs 34) and is reported honestly; the
    certified compressor claim stays dose/interval/PHI slot survival.
  outputs:
    - N05_sms_survival/results/n05c_sample_100.json (frozen manifest)
    - N05_sms_survival/results/n05c_records_20260919.jsonl (per-record, fsync'd)
    - N05_sms_survival/results/n05c_summary_20260919.json (aggregate + Wilson CIs)
  labels:
    paired_design: same 100 advisories, same frozen detectors, all arms.