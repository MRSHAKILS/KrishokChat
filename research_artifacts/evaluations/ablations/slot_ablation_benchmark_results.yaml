  an independent and critical safety barrier. Removing PHI increases dangerous acceptance
  by +10.0pp; removing dosage bounds or units increases hazard by +10.0pp each; and
  collapsing the entire typed schema into unconstrained lexical matching increases
  dangerous acceptance to 80.0% (95% CI: [79.2%, 80.8%]). This empirical ablation
  ladder justifies the necessity of the complete multi-slot relational schema.'
