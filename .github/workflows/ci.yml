name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + compileall)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --dev
      - name: Run test suite
        run: uv run pytest tests
      - name: Byte-compile check
        run: uv run python -m compileall -q app

  frontend:
    name: Frontend (pnpm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v1
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  golden:
    name: Golden replay invariants (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --dev
      - name: Replay golden set and assert mechanical invariants
        run: uv run python scripts/replay_golden.py --assert-invariants

  paper-policy:
    name: Paper policy (forbid deprecated arXiv:2606.29243)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid deprecated arXiv v1 citation
        run: |
          echo "Checking for deprecated arXiv:2606.29243 (docs/PAPER_POLICY.md) — allowlist: policy docs that document the ban..."
          # Allowlist: files that are *allowed* to mention the deprecated ID only to document the ban.
          # Any other file citing it as a source is a failure.
          HITS=$(grep -R --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.venv --exclude-dir=htmlcov --include="*.md" --include="*.ts" --include="*.tsx" --include="*.py" "2606\.29243" paper/ docs/ frontend/ backend/ 2>/dev/null | grep -v "docs/PAPER_POLICY.md" | grep -v "paper/manuscript/README.md" | grep -v "paper/manuscript/expert-systems-skeleton.md" | grep -v "CLAIM_LEDGER_FREEZE" | grep -v "PAPER_POLICY" | grep -v "deprecated" | grep -v "DEPRECATED" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "ERROR: deprecated arXiv:2606.29243 cited outside allowlist — see docs/PAPER_POLICY.md and paper/manuscript/README.md"
            exit 1
          fi
          # Also ensure no manuscript content cites it as a source (exclude the banned-citation documentation line itself)
          # Second sweep: any manuscript .md under paper/manuscript/ that contains the ID outside the References/Banned section is already covered by the allowlist filter above;
          # the remaining check is that the only allowed occurrences are those three policy files.
          echo "No forbidden arXiv citation found outside allowlist."