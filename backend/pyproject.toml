[project]
name = "backend"
version = "0.1.0"
description = "KrishokChat Advisory System - Backend API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "bnunicodenormalizer>=0.1.7",
    "edge-tts>=7.2.8",
    "faiss-cpu>=1.15.0",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.17.0",
    "httpx>=0.28.1",
    "onnx>=1.22.0",
    "onnxruntime>=1.28.0",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "reportlab>=5.0.0",
    "sentence-transformers>=5.7.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.116",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
markers = [
    "live_llm: requires a running backend with a live LLM provider; skipped unless RUN_LIVE_E2E=1",
]
