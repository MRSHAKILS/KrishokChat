# ─────────────────────────────────────────────────
# PILLAR 4 — SAFETY ARCHITECTURE (Column B)
# ─────────────────────────────────────────────────
safety_architecture:
  pipeline_stages: 4
  stages:
    - "1. Safety/Router — classify BEFORE retrieval"
    - "2. Retrieval — hybrid BM25 + FAISS dense, RRF fusion, top-5"
    - "3. Generation — Gemma-4-E4B 4-bit, LoRA r=32, streamed Bengali"
    - "4. Verifier — 14-field claim schema, 6 relation types"

  safety_classifier:
    categories: 6
    fail_closed: true
    categories_detail:
      safe_agri: "proceed to retrieval"
      banned_or_restricted_chemical: "-> 16123 Krishi Call Center"
      self_harm_or_poisoning_risk: "-> 999 + 16123 + medical help"
      off_topic: "-> scope message"
      prompt_injection: "-> silent refusal"
      low_confidence: "-> 16123 referral"
    source: "AGENTS.md + backend/app/domain/enums.py"
    verified: true

  structured_verifier:
    approach: "Deterministic-first: parser/normalizer + structured relation matcher + fail-closed policy"
    optional_nli: "Bounded secondary resolver only — never gold"
    schema_fields: 14
    fields:
      - crop
      - disease
      - action
      - chemical
      - formulation
      - amount
      - unit
      - denominator
      - interval
      - PHI_safety
      - polarity
      - applicability
      - uncertainty
      - source_id
    relation_types: 6
    relations:
      - supported
      - contradicted
      - partially_supported
      - unsupported
      - ambiguous
      - not_applicable
    fail_closed_rule: "Missing evidence -> abstain. Safety-critical claims need all 14 fields supported."
    source: "paper/system_evolution_plan_2026/execution_planning_2026_08_12/06_CLAIM_SCHEMA_AND_VERIFIER.md"
    verified: true

  audit_log:
    format: "Local JSONL"
    path: "backend/app/logs/safety_audit.jsonl"
    surfaced: "/analytics dashboard"
    verified: true

  helplines:
    krishi: "16123"
    emergency: "999"
    verified: true

