# Keyless lightweight demo: no API keys, no GPU, no .env file required.
#   docker compose -f docker-compose.demo.yml up --build
# Open http://localhost:8080
name: krishokchat-demo

services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend.demo
    image: krishokchat-demo-backend
    restart: unless-stopped
    networks:
      - krishok_net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/Dockerfile.frontend
      args:
        BACKEND_URL: http://backend:8000
    image: krishokchat-demo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - krishok_net

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - krishok_net

networks:
  krishok_net:
    driver: bridge
