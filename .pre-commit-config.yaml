# Pre-commit — advisory only (not enforced in CI yet, per S5).
# Install locally with: pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: double-quote-string-fixer
        exclude: \.md$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--skip=.git,*.pdf,*.png,*.jpg,*.jpeg,*.gif,*.webp,*.pt,*.onnx,*.gguf,*.faiss,*.pkl,*.npy]
        exclude: ^(frontend/pnpm-lock\.yaml|backend/uv\.lock)$

  - repo: local
    hooks:
      - id: forbid-arxiv-v1
        name: Forbid deprecated arXiv:2606.29243 (PAPER_POLICY.md)
        # Allowlist: policy docs are allowed to mention the ID only to document the ban.
        entry: bash -c 'HITS=$(grep -R --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.venv --include="*.md" --include="*.ts" --include="*.tsx" --include="*.py" "2606\.29243" paper/ docs/ frontend/ backend/ 2>/dev/null | grep -v "docs/PAPER_POLICY.md" | grep -v "paper/manuscript/README.md" | grep -v "paper/manuscript/expert-systems-skeleton.md" | grep -v "CLAIM_LEDGER_FREEZE" | grep -v "PAPER_POLICY" | grep -v "deprecated" | grep -v "DEPRECATED" || true); if [ -n "$HITS" ]; then echo "$HITS"; echo "ERROR: deprecated arXiv:2606.29243 cited outside allowlist — see docs/PAPER_POLICY.md"; exit 1; fi; exit 0'
        language: system
        pass_filenames: false
        always_run: true

# Note: No Python formatter (ruff/black) or ESLint hook yet — those will land
# in a follow-up after S6, once the repo is structure-clean and CI can run them.
# This file is intentionally minimal to avoid breaking the demo.
