# experiments/specs/E28_metamorphic_authority_testing.spec.yaml
# Specification for Layer E28: Metamorphic Authority & Single-Record Integrity Testing

meta:
  experiment_id: E28
  title: "Metamorphic Authority & Single-Record Integrity Testing"
  target_venue: "Computers and Electronics in Agriculture (Elsevier)"
  research_question: "RQ2: Single-Record Authority & Hallucination Prevention"
  status: specified

hypothesis:
  claim_id: "S-E28"
  statement: >
    Applying an exhaustive suite of 11 single-slot metamorphic perturbations (crop, pest, active ingredient,
    formulation, dosage value, unit, water volume, interval, PHI, regulatory polarity, provenance hash) to
    valid agricultural advisory tuples causes multi-citation and lexical RAG baselines to falsely certify
    between 38% and 82% of mutated claims, whereas the 11-slot single-record verifier achieves 100.0%
    rejection rate (0.0% false certification, 0.0% CUAR) with sub-4ms p95 latency.

protocol:
  dataset: "11,000 metamorphic perturbation cases (1,000 cases per mutation operator across 11 slots)"
  mutation_operators:
    - mu_01_crop_mutation
    - mu_02_pest_disease_mutation
    - mu_03_active_ingredient_mutation
    - mu_04_formulation_mutation
    - mu_05_dosage_overdose_mutation
    - mu_06_dosage_unit_mutation
    - mu_07_water_volume_mutation
    - mu_08_interval_shortening_mutation
    - mu_09_phi_shortening_mutation
    - mu_10_regulatory_polarity_flip
    - mu_11_provenance_hash_corruption
  systems_evaluated:
    - B0_Unconstrained_LLM
    - B1_Lexical_BM25_Matcher
    - B2_Dense_Embedding_Matcher
    - B3_Citation_MultiDoc_Alignment
    - B4_LLM_as_a_Judge_Guardrail
    - B5_Partial_8Slot_Matcher
    - B6_11Slot_SingleRecord_BAA
  metrics:
    - metamorphic_rejection_rate_pct
    - false_certification_rate_pct
    - critical_unsafe_acceptance_rate_pct
    - wilson_95_ci_pct
    - verification_latency_ms
