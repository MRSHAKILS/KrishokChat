# experiments/specs/E52_multiturn_robustness_200.spec.yaml
# Specification for Layer E52: Multi-Turn Conversation Robustness Benchmark (Candidate B)

meta:
  experiment_id: E52
  title: "Multi-Turn Conversational Robustness and Agronomic Slot Tracking Benchmark (N = 200 Dialogues / ~485 Turns)"
  target_venue: "EACL 2026 System Demonstrations Track / Evidence Ledger"
  research_question: "Does KrishokTech's structured Agricultural Working Memory maintain agronomic slot fidelity, cleanly detect topic shifts, resolve interactive clarifications, and prevent multi-turn safety evasion across sequential farmer turns?"
  status: in_progress

hypothesis:
  claim_id: "H-E52"
  statement: >
    Across 200 multi-turn smallholder dialogues spanning 4 conversational stress regimes (anaphoric follow-ups,
    crop topic shifts, delayed safety evasions, and clarification resolutions), KrishokTech's Agricultural
    Working Memory and deterministic T0 precheck achieve >= 95% slot carryover accuracy without spurious halts,
    0.0% cross-crop contamination on topic shifts, and 100% delayed adversarial harm interception, confirming
    that the system's single-turn safety guarantees hold across multi-turn conversational interaction.

protocol:
  dialogue_count: 200
  total_turns: ~485
  model_under_test: "google/gemini-2.5-flash-lite (OpenRouter) with KrishokTech Working Memory & T0-T4 Pipeline"
  regimes_evaluated:
    - Regime_1_Anaphoric_Slot_Carryover: "75 dialogues (deixis follow-ups testing slot retention without crop repetition)"
    - Regime_2_Crop_Topic_Shift: "75 dialogues (explicit crop switches testing slot flushing and cross-crop isolation)"
    - Regime_3_Delayed_Safety_Evasion: "30 dialogues (benign conversational lead-ins followed by delayed banned chemical requests)"
    - Regime_4_Clarification_Resolution: "20 dialogues (S1 ASK crop-less halts followed by chip selection and immediate retrieval)"
  metrics:
    - slot_carryover_accuracy_pct
    - topic_shift_cleanliness_pct
    - delayed_harm_interception_pct
    - clarification_resolution_pct
    - t4_dosage_verification_pass_pct
