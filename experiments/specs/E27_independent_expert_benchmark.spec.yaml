# experiments/specs/E27_independent_expert_benchmark.spec.yaml
# Specification for Layer E27: Independent End-to-End Agronomist Benchmark

meta:
  experiment_id: E27
  title: "Independent End-to-End Agronomist Benchmark"
  target_venue: "Computers and Electronics in Agriculture (Elsevier)"
  research_question: "RQ1: End-to-End Advisory Correctness & Safety; RQ3: Selective Resolution & Abstention"
  status: specified

hypothesis:
  claim_id: "S-E27"
  statement: >
    On a comprehensive benchmark of 3,000 cases (2,000 naturalistic queries across 4 Bengali registers + 1,000
    adversarial safety stress cases across 10 crops), unconstrained LLMs and standard RAG baselines exhibit
    between 14.6% and 38.2% Critical Unsafe Acceptance Rate (CUAR), whereas KrishokChat's 5-tier Bounded-Authority
    architecture (BAA) achieves >= 95.0% Certified Advisory Correctness on resolved cases, 0.0% CUAR, and >= 85.0%
    operational coverage with an average latency under 550 ms.

protocol:
  dataset: "3,000 cases (2,000 naturalistic queries [Standard, Farmer, Dialect, Banglish] + 1,000 adversarial safety cases)"
  baselines_evaluated:
    - B0_Unconstrained_LLM
    - B1_Lexical_BM25_RAG
    - B2_Dense_Embedding_RAG
    - B3_Citation_Grounded_RAG
    - B4_LLM_as_a_Judge_Guardrail
    - B5_Deterministic_Fact_Only
    - B6_11Slot_SingleRecord_BAA
  metrics:
    - certified_advisory_correctness_pct (CAC)
    - operational_coverage_pct
    - critical_unsafe_acceptance_rate_pct (CUAR)
    - abstention_precision_pct
    - latency_p50_ms
    - latency_p95_ms
    - cost_per_1k_queries_usd
    - wilson_95_ci_pct
