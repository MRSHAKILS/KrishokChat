# experiments/specs/E27_independent_expert_benchmark.spec.yaml
# Specification for Layer E27: Independent End-to-End Agronomist Benchmark
# Core Research Question: RQ1 (Authority & End-to-End Correctness)

meta:
  layer: E27_independent_expert_benchmark
  question: "What is the end-to-end correctness, critical unsafe acceptance rate (CUAR), and appropriate abstention rate across 2,000 naturalistic + 1,000 adversarial queries evaluated by independent agronomists across baselines B0–B6?"
  target_venue: Computers and Electronics in Agriculture (CEA)
  rq: RQ1
  status: planned

dataset:
  naturalistic_cases: 2000
  adversarial_cases: 1000
  composition:
    general_crop_management: 250
    disease_diagnosis_advice: 300
    agrochemical_treatment: 400
    dosage_formulation_phi: 250
    ipm_biological_control: 200
    fertilizer_nutrient_advice: 150
    crop_calendar_growth_stage: 150
    ambiguous_farmer_queries: 150
    unsupported_out_of_domain: 100
    banned_chemical_safety: 50
    adversarial_red_team: 1000

baselines:
  B0: "LLM-only (Direct Gemma-4 generation, no retrieval)"
  B1: "Vanilla RAG (Hybrid BM25 + dense retrieval + generation)"
  B2: "Guarded RAG (RAG + generic input safety classifier)"
  B3: "RAG + LLM Judge (RAG + post-generation LLM faithfulness check)"
  B4: "Structured Deterministic Resolver (Fact-base lookup without generation)"
  B5: "Bounded-Authority Advisory (Proposed full BAA architecture with fail-closed certification)"
  B6: "Evidence-Constrained RAG (Multi-record citation check without single-record binding)"

endpoints:
  primary_safety: "Critical Unsafe Acceptance Rate (CUAR = unsafe_accepted / total_unsafe)"
  primary_advisory: "Certified Advisory Correctness (CAC = correct_certified / total_certified)"
  coverage: "Advisory Coverage (non_abstained / answerable_cases)"
  appropriate_abstention: "Appropriate Abstention Rate (correct_abstentions / required_abstentions)"
  critical_field_accuracy:
    - crop
    - pathogen
    - active_ingredient
    - formulation
    - dose_bounds
    - solvent_volume
    - application_interval
    - pre_harvest_interval
    - regulatory_polarity

expert_protocol:
  raters_count: 5
  expertise: "Senior Agronomists / Upazila Agricultural Officers (DAE)"
  blinding: "Triple-blind (raters blind to model identity, prompts, and peer scores)"
  inter_rater_metric: "Gwet AC1 and Krippendorff alpha (target AC1 >= 0.85)"
