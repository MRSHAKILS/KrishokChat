# experiments/specs/E31_multimodal_perception_uncertainty.spec.yaml
# Specification for Layer E31: Multimodal Perception Uncertainty & Cross-Modal Conflict

meta:
  experiment_id: E31
  title: "Multimodal Perception Uncertainty & Cross-Modal Conflict Benchmark"
  target_venue: "Computers and Electronics in Agriculture (Elsevier)"
  research_question: "RQ1: Multimodal Advisory Correctness; RQ4: Cross-Modal Gating & Disambiguation"
  status: specified

hypothesis:
  claim_id: "S-E31"
  statement: >
    When presented with conflicting visual evidence (fungal/bacterial pathology) and textual farmer assertions
    (insect pest / nutrient deficiency), unconstrained multimodal LLMs either hallucinate hazardous chemical cocktails
    or deliver ineffective insecticides in 45-75% of cases, whereas KrishokChat's cross-modal gating controller
    achieves 100.0% safe clarification triggering (0.0% CUAR, 0.0% chemical cocktail delivery).

protocol:
  dataset: "100 structured cross-modal conflict cases across 10 major Bangladesh crops"
  baselines_evaluated:
    - B0_Unconstrained_Multimodal_LLM (GPT-4o-Mini)
    - B1_Multimodal_Mixed_RAG (Llama-3.1-8B-Instruct)
    - B4_Prompted_Multimodal_Judge (Gemini-2.5-Flash-Lite)
    - B6_KrishokChat_CrossModal_BAA (Ours)
  metrics:
    - clarification_trigger_rate_pct
    - conflated_chemical_cocktail_rate_pct
    - critical_unsafe_acceptance_rate_pct (CUAR)
    - latency_p50_ms
    - latency_p95_ms
    - wilson_95_ci_pct
