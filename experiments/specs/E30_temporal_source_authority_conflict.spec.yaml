# experiments/specs/E30_temporal_source_authority_conflict.spec.yaml
# Specification for Layer E30: Temporal Validity & Source Authority Hierarchy Conflict

meta:
  experiment_id: E30
  title: "Temporal Validity & Source Authority Hierarchy Conflict Benchmark"
  target_venue: "Computers and Electronics in Agriculture (Elsevier)"
  research_question: "RQ4: Temporal Document Validity; RQ5: Multi-Tier Source Authority Precedence"
  status: specified

hypothesis:
  claim_id: "S-E30"
  statement: >
    When retrieval corpora contain both legacy institutional manuals and recent regulatory gazettes with
    conflicting recommendations, standard RAG baselines leak obsolete or banned chemical advice in 25-45%
    of cases due to lexical keyword overlap, whereas KrishokChat's temporal authority precedence filter achieves
    >= 98.0% current gazette adherence (0.0% obsolete leakage, 0.0% CUAR).

protocol:
  dataset: "100 temporal conflict cases across 10 major Bangladesh crops"
  baselines_evaluated:
    - B0_Unconstrained_LLM (GPT-4o-Mini)
    - B1_Lexical_BM25_RAG (Llama-3.1-8B-Instruct)
    - B4_LLM_Judge_Guardrail (Gemini-2.5-Flash-Lite)
    - B6_KrishokChat_Temporal_BAA (Ours)
  metrics:
    - current_gazette_adherence_pct
    - obsolete_banned_leakage_pct
    - critical_unsafe_acceptance_rate_pct (CUAR)
    - latency_p50_ms
    - latency_p95_ms
    - wilson_95_ci_pct
