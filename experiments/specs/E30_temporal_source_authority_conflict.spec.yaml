# experiments/specs/E30_temporal_source_authority_conflict.spec.yaml
# Specification for Layer E30: Temporal Validity & Source Authority Conflict Matrix
# Core Research Question: RQ4, RQ5 (Temporal Integrity & Authority Hierarchy)

meta:
  layer: E30_temporal_source_authority_conflict
  question: "How does the advisory pipeline resolve conflicting multi-document evidence across the authority hierarchy (Regulatory > Institutional > Secondary) and temporal validity states (Current vs. Obsolete)?"
  target_venue: Computers and Electronics in Agriculture (CEA)
  rq: RQ4, RQ5
  status: planned

authority_hierarchy:
  Level_1_Regulatory: "Ministry of Agriculture (MoA) / Plant Quarantine & Pesticide Governance"
  Level_2_Institutional: "BARI, BRRI, BJRI, BINA official Krishiprojukti Handbooks (2022–2026)"
  Level_3_Legacy_Institutional: "BARI/BRRI Handbooks (pre-2018 superseded recommendations)"
  Level_4_Secondary: "Extension pamphlets, regional NGO training manuals, commercial distributor sheets"

test_matrix:
  Condition_A: "Current Authoritative vs Outdated Authoritative (Testing temporal override)"
  Condition_B: "Current Secondary vs Outdated Authoritative (Testing authority preservation)"
  Condition_C: "Withdrawn/Banned Chemical in Old Source vs Clean New Source (Testing safety fail-closed)"
  Condition_D: "Direct Unresolvable Institutional Conflict (Testing safe abstention / human escalation)"

metrics:
  current_authoritative_selection_pct: "Accuracy in selecting current Level 1/2 sources"
  stale_source_certification_pct: "Dangerous certification of obsolete recommendations (CUAR_temporal)"
  unresolved_conflict_abstention_pct: "Safe non-certification when authoritative sources disagree"
